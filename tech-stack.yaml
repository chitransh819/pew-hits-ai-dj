# tech-stack.yaml
project: pew-hits-ai-dj
version: 1.0.0
python: "3.11"

dependencies:
  # Web Framework
  fastapi: "0.109.0"
  uvicorn: "0.27.0"
  pydantic: "2.5.3"
  pydantic-settings: "2.1.0"

  # Audio Analysis
  librosa: "0.10.2"
  numpy: "1.26.3"
  scipy: "1.11.4"
  mutagen: "1.47.0"

  # ML Models (CPU only)
  torch: "2.2.0"
  torchaudio: "2.2.0"
  onnxruntime: "1.17.0"
  scikit-learn: "1.3.2"
  xgboost: "2.0.3"
  joblib: "1.3.2"

  # Model Hub
  huggingface-hub: "0.20.3"
  safetensors: "0.4.2"

  # Database
  aiosqlite: "0.19.0"
  sqlalchemy: "2.0.25"

  # NVIDIA API
  openai: "1.12.0"
  httpx: "0.26.0"
  tenacity: "8.2.3"

  # File Watching
  watchdog: "3.0.0"

  # Config & Logging
  python-dotenv: "1.0.0"
  structlog: "24.1.0"
  loguru: "0.7.2"

  # Monitoring
  prometheus-client: "0.19.0"

dev_dependencies:
  pytest: "7.4.4"
  pytest-asyncio: "0.23.3"
  pytest-cov: "4.1.0"
  httpx: "0.26.0"
  black: "23.12.0"
  ruff: "0.1.15"
  mypy: "1.7.1"
  pre-commit: "3.6.0"

docker:
  base_image: "python:3.11-slim-bookworm"
  system_deps:
    - ffmpeg
    - libsndfile1
    - libmagic1
    - gcc
    - g++

models:
  openl3:
    variant: "music_mel256_emb512"
    format: "onnx"
    source: "huggingface: facebook/openl3-music-mel256-emb512"
    size_mb: 50
    input: "16kHz mono audio, 30s clips"
    output: "512-dim embedding"

  efficientat:
    variant: "mn10_as"
    format: "onnx"
    source: "huggingface: fschmid56/EfficientAT-mn10_as"
    size_mb: 5
    input: "16kHz mono audio, 10s clips"
    output: "512-dim embedding"

  classifiers:
    genre:
      classes: 87
      source: "trained_on_mtg_jamendo"
      format: "joblib"
    mood:
      classes: ["happy", "sad", "relaxed", "aggressive", "party", "acoustic", "electronic"]
      format: "joblib"
    danceability:
      classes: ["danceable", "not_danceable"]
      format: "joblib"
    vocal_instrumental:
      classes: ["vocal", "instrumental"]
      format: "joblib"

nvidia:
  base_url: "https://integrate.api.nvidia.com/v1"
  models:
    primary_reasoning: "nvidia/nemotron-3-ultra-550b-a55b"
    fast_reasoning: "nvidia/nemotron-3.5-lightning-30b-a3b"
    embeddings: "nvidia/nemotron-3.5-embed-1b"
    reranking: "nvidia/nemotron-3.5-rerank-8b"
  limits:
    rpm: 40
    timeout_reasoning: 60
    timeout_embedding: 15
    timeout_rerank: 30
    max_retries: 3

analysis:
  workers: 4
  chunk_duration_sec: 30
  sample_rate: 16000
  max_concurrent_analysis: 2

station_profiles:
  pew-hits-english:
    languages: ["en"]
    primary_genres: ["pop", "soft_pop", "acoustic", "indie_pop", "relaxing", "romantic"]
    mood_preferences:
      relaxed: 1.0
      romantic: 0.9
      acoustic: 0.8
      calm: 0.8
      happy: 0.5
      nostalgic: 0.4
    energy_range: [0.15, 0.50]
    artist_cooldown: 3
    transition_rules:
      max_bpm_delta: 20
      max_energy_delta: 0.25
      prefer_smooth_transitions: true
      avoid_abrupt_genre_shifts: true

  pew-hits-desi:
    languages: ["hi", "pa", "bn", "ta", "te", "mr", "gu"]
    primary_genres: ["bollywood", "hindi_pop", "indian_classical", "punjabi", "romantic", "emotional", "soft_melodies", "devotional", "indie_hindi"]
    mood_preferences:
      romantic: 1.0
      emotional: 0.95
      soft: 0.9
      nostalgic: 0.85
      devotional: 0.6
      peaceful: 0.7
    energy_range: [0.10, 0.40]
    artist_cooldown: 3
    transition_rules:
      max_bpm_delta: 15
      max_energy_delta: 0.20
      prefer_smooth_transitions: true
      avoid_abrupt_genre_shifts: true
      emotional_continuity: true